\" font-weight=\"800\" fill=\"#15191b\" font-family=\"Malgun Gothic\">옥상<\/text><text x=\"235\" y=\"28\" font-size=\"13\" text-anchor=\"middle\" fill=\"#15191b\" font-family=\"Malgun Gothic\">촬영·행사<\/text><rect x=\"70\" y=\"42\" width=\"330\" height=\"30\" fill=\"#e8f5ef\" stroke=\"#127A5A\" stroke-width=\"1.4\"/><text x=\"60\" y=\"62\" font-size=\"13\" text-anchor=\"end\" font-weight=\"800\" fill=\"#15191b\" font-family=\"Malgun Gothic\">5층<\/text><text x=\"235\" y=\"62\" font-size=\"13\" text-anchor=\"middle\" fill=\"#15191b\" font-family=\"Malgun Gothic\">크리에이터 작업실 6실<\/text><rect x=\"70\" y=\"76\" width=\"330\" height=\"30\" fill=\"#cfe7db\" stroke=\"#127A5A\" stroke-width=\"1.4\"/><text x=\"60\" y=\"96\" font-size=\"13\" text-anchor=\"end\" font-weight=\"800\" fill=\"#15191b\" font-family=\"Malgun Gothic\">4층<\/text><text x=\"235\" y=\"96\" font-size=\"13\" text-anchor=\"middle\" fill=\"#15191b\" font-family=\"Malgun Gothic\">VARIOUS ARTISTS·에이전시 사무실<\/text><rect x=\"70\" y=\"110\" width=\"330\" height=\"30\" fill=\"#e8f5ef\" stroke=\"#127A5A\" stroke-width=\"1.4\"/><text x=\"60\" y=\"130\" font-size=\"13\" text-anchor=\"end\" font-weight=\"800\" fill=\"#15191b\" font-family=\"Malgun Gothic\">3층<\/text><text x=\"235\" y=\"130\" font-size=\"13\" text-anchor=\"middle\" fill=\"#15191b\" font-family=\"Malgun Gothic\">촬영 스튜디오 2실<\/text><rect x=\"70\" y=\"144\" width=\"330\" height=\"30\" fill=\"#e8f5ef\" stroke=\"#127A5A\" stroke-width=\"1.4\"/><text x=\"60\" y=\"164\" font-size=\"13\" text-anchor=\"end\" font-weight=\"800\" fill=\"#15191b\" font-family=\"Malgun Gothic\">2층<\/text><text x=\"235\" y=\"164\" font-size=\"13\" text-anchor=\"middle\" fill=\"#15191b\" font-family=\"Malgun Gothic\">라이브 부스 10실<\/text><rect x=\"70\" y=\"178\" width=\"330\" height=\"30\" fill=\"#ffffff\" stroke=\"#127A5A\" stroke-width=\"1.4\"/><text x=\"60\" y=\"198\" font-size=\"13\" text-anchor=\"end\" font-weight=\"800\" fill=\"#15191b\" font-family=\"Malgun Gothic\">1층<\/text><text x=\"235\" y=\"198\" font-size=\"13\" text-anchor=\"middle\" fill=\"#15191b\" font-family=\"Malgun Gothic\">쇼룸·팝업 (갤러리)<\/text><rect x=\"70\" y=\"212\" width=\"330\" height=\"30\" fill=\"#eceae4\" stroke=\"#127A5A\" stroke-width=\"1.4\"/><text x=\"60\" y=\"232\" font-size=\"13\" text-anchor=\"end\" font-weight=\"800\" fill=\"#15191b\" font-family=\"Malgun Gothic\">지하<\/text><text x=\"235\" y=\"232\" font-size=\"13\" text-anchor=\"middle\" fill=\"#15191b\" font-family=\"Malgun Gothic\">음악 연습실 8실<\/text><line x1=\"62\" y1=\"210\" x2=\"410\" y2=\"210\" stroke=\"#7FE0B5\" stroke-width=\"3\"/><\/svg>"}],"sources":["매물: 네이버페이 부동산 상가 월세 광고 2026.11.5 조회(9개 동 10,612건 → 같은 위치·층·면적끼리 묶음), 공개판에는 매물번호·링크·개별 목록을 넣지 않음","중개보수: 공인중개사법 시행규칙 제20조 — 상가 0.9% 이내, 거래금액 = 보증금 + 월세×100 (5천만원 미만이면 ×70)","환원율 참고: 한국부동산원 2026년 3분기 상업용부동산 임대동향 — 분기 소득수익률 오피스 0.70%, 집합상가 0.84%","팝업 대관: 팝업코리아(연남 17평 77만원~, 동교로 27평 99만원~, 상수 30평 50만원~), 유어스페이스 성수 25평 평일 40만·주말 70만, NALLI 성수 1층 20평 90~120만","방송·스튜디오: 닥터고블린 방송룸 시간당 3만원·일 20만원, 스페이스클라우드 셀프 스튜디오 시간당 1.5만원 등","연습실: 스튜디오 놀 2026 — 8~10㎡ 월 30~40만원, 홍대·마포 합주실 시간당 2.2~3.5만원, 녹음 시간당 6만원(디엠디 뮤직)","인테리어·방음 단가는 가정. 견적을 받으면 가정 값 탭에서 바꾸세요"],"unitCount":4178,"cheapCount":402,"notice":{"t":"공간별 사업계획을 다시 쓰는 중입니다","d":"상권 데이터(업종별 매출·폐업률·유동인구)로 각 공간에 맞는 업종을 고른 새 사업계획으로 오늘 바꿉니다. 지금 보이는 후보 분석은 이전 판입니다."}}</script>
<script>
(function () {
const app = document.getElementById('app');
const MEM = {};
const LS = { get(k, d) { let raw = null; try { raw = localStorage.getItem('gmp_' + k); } catch (e) {} if (raw == null && MEM[k] !== undefined) raw = MEM[k]; try { const v = JSON.parse(raw); return v == null ? d : v; } catch (e) { return d; } }, set(k, v) { const s = JSON.stringify(v); MEM[k] = s; try { localStorage.setItem('gmp_' + k, s); } catch (e) {} } };
const esc = s => String(s == null ? '' : s).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
const W = v => { v = Math.round(v); const neg = v < 0; v = Math.abs(v); let s; if (v >= 10000) { const e = Math.floor(v / 10000), r = v % 10000; s = e + '억' + (r ? ' ' + r.toLocaleString() + '만' : ''); } else s = v.toLocaleString() + '만'; return (neg ? '-' : '') + s; };
const sign = v => `<span class="${v >= 0 ? 'pos' : 'neg'}">${v >= 0 ? '+' : ''}${W(v)}</span>`;
const pyN = a => Math.round(a / 3.3058 * 10) / 10;
function toast(m) { const t = document.createElement('div'); t.className = 'toast'; t.textContent = m; document.body.appendChild(t); setTimeout(() => t.remove(), 2200); }
const b64d = s => Uint8Array.from(atob(s), c => c.charCodeAt(0));
async function decrypt(pw) {
  const key = await crypto.subtle.importKey('raw', new TextEncoder().encode(pw), 'PBKDF2', false, ['deriveKey']);
  const k = await crypto.subtle.deriveKey({ name: 'PBKDF2', salt: b64d(ENC.salt), iterations: ENC.iter, hash: 'SHA-256' }, key, { name: 'AES-GCM', length: 256 }, false, ['decrypt']);
  const buf = await crypto.subtle.decrypt({ name: 'AES-GCM', iv: b64d(ENC.iv) }, k, b64d(ENC.ct));
  return JSON.parse(new TextDecoder().decode(buf));
}
function lockScreen(msg) {
  app.innerHTML = `<div class="lock"><div class="tiny" style="color:#7FE0B5;font-weight:800">작가님 개인용 · 내부 자료</div><h1>가게<span>먼저</span></h1><p>빈 공간을 찾아 내 사업으로 채우고 건물가치를 키우는 개인 기획실입니다.</p>
  <input id="pw" type="password" placeholder="비밀번호" autocomplete="current-password"><label class="ck" style="color:#cfd9d5"><input type="checkbox" id="rem" checked> 이 기기에서 기억하기</label>
  <button class="btn" id="go" style="margin-top:8px">열기</button><p class="tiny" style="color:#ff9b7a;margin-top:10px">${msg || ''}</p>
  <p class="tiny" style="color:#9fb3ab;margin-top:30px">자료는 암호화되어 있어 비밀번호 없이는 읽을 수 없습니다. 매물 정보는 개인 검토용이며 외부에 공유하지 않습니다.</p></div>`;
  const go = async () => { const pw = document.getElementById('pw').value.trim(); if (!pw) return; document.getElementById('go').textContent = '여는 중…'; try { const D = await decrypt(pw); if (document.getElementById('rem').checked) LS.set('pw', pw); start(D); } catch (e) { lockScreen('비밀번호가 맞지 않아요.'); } };
  document.getElementById('go').onclick = go; document.getElementById('pw').addEventListener('keydown', e => { if (e.key === 'Enter') go(); });
}
start(JSON.parse(document.getElementById('data').textContent));

function start(D) {
const DONGS = D.dongs;
// unit: [id, di, f, tot, area, dep, rent, gapPct, cls, tags, feat, conf, lat, lng]
const U = D.units.map(a => ({ id: a[0], dong: DONGS[a[1]], di: a[1], f: a[2], tot: a[3], a: a[4], dep: a[5], rent: a[6], gap: a[7], cls: a[8], tags: a[9] ? a[9].split('|') : [], feat: a[10] || '', conf: a[11], lat: a[12], lng: a[13] }));
const band = f => f < 0 ? 'B' : f === 1 ? '1' : f === 2 ? '2' : '3+';
const BANDN = { B: '지하', 1: '1층', 2: '2층', '3+': '3층 이상' };
const flS = f => f < 0 ? '지하' + (-f) + '층' : f + '층';
const DEF = { cap: 3.5, boothM: 55, boothOcc: 90, boothH: 1.2, popDay: 2.05, popDays: 12, roomM: 40, roomOcc: 85, studioH: 3.5, studioHrs: 60, officeM: 45, fitShow: 100, fitSound: 150, boothCost: 300 };
const A = () => Object.assign({}, DEF, LS.get('assume', {}));
const feeOf = (dep, rent) => { let t = dep + rent * 100; if (t < 5000) t = dep + rent * 70; return Math.round(t * 0.009); };
const has = (u, re) => re.test(u.feat + ' ' + u.tags.join(' '));
const TIER1 = ['연남동', '합정동', '성수동2가', '이태원동'];
// ---------- business engine ----------
function models(u) {
  const a = A(); const py = pyN(u.a); const f = u.f; const out = [];
  const base = (name, key, rev, opex, capex, note, lay) => { const fee = feeOf(u.dep, u.rent); const fixed = u.rent + (u.mg || 0) + opex; const profit = Math.round(rev - fixed); const cap = Math.round(capex); return { key, name, rev: Math.round(rev), opex: Math.round(opex), fixed: Math.round(fixed), profit, capex: cap, fee, initial: u.dep + fee + cap, payback: profit > 0 ? Math.round((fee + cap) / profit) : null, be: Math.round(fixed / Math.max(1, rev) * 100), note, lay }; };
  if (f === 1 && py >= 12 && py <= 50) { const day = Math.round(a.popDay * py * (TIER1.includes(u.dong) ? 1 : 0.8)); const rev = a.popDays * day + 120; out.push(base('쇼룸·팝업 무대', 'show', rev, 280, py * a.fitShow + 1100, `팝업 대관 월 ${a.popDays}일 × ${day}만 + 쇼룸 판매 이익 120만`, 'show')); }
  if (f !== 1 && f >= -1 && py >= 22 && py <= 70) { const booths = Math.max(4, Math.floor((py - 10) / 2.6)); const mb = Math.round(booths * 2 / 3), hb = booths - mb; const rev = mb * a.boothM * a.boothOcc / 100 + hb * 120 * 0.6 + 150; out.push(base('라이브 스튜디오', 'live', rev, 230 + booths * 8, booths * a.boothCost + 2350, `부스 ${booths}실 (월 ${mb} · 시간 ${hb}) + 큰 스튜디오 시간 대관`, 'live')); }
  if (f >= -1 && py >= 22 && py <= 70) { const rooms = Math.max(4, Math.floor((py - 12) / 3.3)); const rev = rooms * a.roomM * a.roomOcc / 100 + 250 + 120; const fitK = f < 0 ? a.fitSound : a.fitSound * 1.15; out.push(base('사운드 하우스 (작업실+연습실)', 'sound', rev, 240, py * fitK + 1800, `개인 연습실 ${rooms}실 + 합주실 + 녹음 대관${f < 0 ? '' : ' · 위층이라 방음비 15% 더'}`, 'sound')); }
  if (f >= 2 && py >= 22 && py <= 70) { const n = py >= 30 ? 2 : 1; const roof = has(u, /루프탑|옥상/); const rev = n * a.studioHrs * a.studioH + (roof ? 320 : 0); out.push(base('촬영 스튜디오' + (roof ? ' + 루프탑' : ''), 'shoot', rev, 300, py * 60 + 1400 + (roof ? 700 : 0), `스튜디오 ${n}실 × 월 ${a.studioHrs}시간 × ${a.studioH}만${roof ? ' + 루프탑 행사 4회' : ''}`, 'shoot')); }
  if (f >= 2 && py >= 18 && py <= 90) { const rooms = Math.max(3, Math.floor(py / 6)); const rev = rooms * a.officeM * 0.85; out.push(base('크리에이터 작업실', 'office', rev, 120 + py, py * 80, `작업실 ${rooms}실 × ${a.officeM}만 × 85%`, 'office')); }
  return out.sort((x, y) => y.profit - x.profit);
}
function valueOf(rent) { return Math.round(rent * 12 / (A().cap / 100)); }
// ---------- layouts ----------
function planSvg(Wm, Hm, rooms, opts = {}) {
  const S = opts.s || 22, pad = 16, w = Wm * S, h = Hm * S;
  let g = `<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 ${w + pad * 2} ${h + pad * 2 + 14}" width="100%"><rect x="${pad}" y="${pad}" width="${w}" height="${h}" fill="#fbfaf7" stroke="#15191b" stroke-width="3"/>`;
  for (const r of rooms) { const [x, y, rw, rh, label, col] = r; g += `<rect x="${pad + x * S}" y="${pad + y * S}" width="${rw * S}" height="${rh * S}" fill="${col || '#e8f5ef'}" stroke="#127A5A" stroke-width="1.3"/>`; const fs = Math.min(12.5, rw * S / Math.max(2, label.length) * 1.7); g += `<text x="${pad + (x + rw / 2) * S}" y="${pad + (y + rh / 2) * S + 4}" font-size="${fs.toFixed(1)}" text-anchor="middle" font-weight="700" fill="#15191b">${label}</text>`; }
  if (opts.front) g += `<line x1="${pad}" y1="${pad + h}" x2="${pad + w}" y2="${pad + h}" stroke="#7FE0B5" stroke-width="7"/><text x="${pad + w / 2}" y="${pad + h + 14}" font-size="11" text-anchor="middle" fill="#127A5A" font-weight="800">${opts.front}</text>`;
  return g + `<text x="${pad + w}" y="${pad - 4}" font-size="10" text-anchor="end" fill="#888">약 ${Wm}m × ${Hm}m · 개략(실측 전)</text></svg>`;
}

  <h2 style="margin-top:6px">${esc(u.dong)} · ${flS(u.f)}${u.tot ? ' / ' + u.tot + '층' : ''} · ${pyN(u.a)}평</h2><p class="muted">${esc(u.feat || '')}</p>
  <div class="card"><div class="row"><b style="font-size:17px">보증금 ${W(u.dep)} / 월세 ${u.rent}만</b><span class="tag">${gap}% 쌈</span></div>${gap >= 65 ? '<div class="tiny" style="color:#b45309;font-weight:700;margin-top:4px">동네 시세보다 너무 쌉니다. 광고의 면적이나 가격이 틀렸을 수 있어 중개사 확인이 먼저입니다.</div>' : ''}
  <div class="muted" style="margin-top:4px">전용 ${u.a}㎡ · 전용평당 ${ppy}만 · 이 동 ${BANDN[b]} 중간값 ${med.m}만</div>
  <div class="gapbar"><u style="width:${Math.min(100, ppy / mx * 100)}%"></u><i style="left:${Math.min(99, med.m / mx * 100)}%"></i></div><div class="tiny">초록 = 이 칸 · 검은 선 = 동네 같은 층 중간값</div>
  <div style="margin-top:6px">${u.tags.map(t => `<span class="tag l">${esc(t)}</span>`).join('')}${u.cls === 'v' ? '<span class="tag">무권리</span>' : u.cls === 'o' ? '<span class="tag a">권리금 언급</span>' : ''}</div>
  <div class="grid2" style="margin-top:8px">${/^\d+$/.test(u.id) ? `<a class="btn w sm" href="https://m.land.naver.com/article/info/${u.id}" target="_blank" rel="noopener">네이버에서 보기 ↗</a>` : '<span></span>'}<button class="btn w sm" data-act="fav" data-id="${u.id}">${fav ? '관심 해제' : '관심 저장'}</button></div></div>
  <h3>이 자리에 맞는 사업</h3>${ms.length ? ms.map((m, i) => `<div class="fit ${i === 0 ? 'best' : ''}"><div class="row"><b>${i === 0 ? '추천 · ' : ''}${esc(m.name)}</b><span>${sign(m.profit)}/월</span></div><div class="tiny">${esc(m.note)}</div>
   <div class="nums"><span>초기 비용<b>${W(m.initial)}</b></span><span>회수<b>${m.payback ? m.payback + '개월' : '-'}</b></span><span>본전<b>${m.be}%</b></span></div>
   ${i === 0 ? `<div class="planbox">${autoPlan(m, u)}</div><p class="muted" style="margin:4px 0 0"><b>${esc(CONCEPT[m.lay][0])}</b> · ${esc(CONCEPT[m.lay][1])}</p>` : ''}</div>`).join('') : '<p class="muted">이 크기·층에 맞는 사업 모델이 아직 없어요 (너무 작거나 큼).</p>'}
  <p class="tiny">매출·비용은 '가정 값' 탭의 숫자로 계산합니다. 월 고정비 = 월세 + 운영비, 부가세 제외.</p>
  <div class="card dark"><b>임대인에게 주는 가치</b><p class="muted" style="margin:4px 0 0">이 칸이 월 ${u.rent}만에 채워지면 건물가치 약 <b style="color:#7FE0B5">${W(valueOf(u.rent))}</b> 상승 (연 임대료 ÷ ${A().cap}%, 가정)</p></div>
  ${best ? `<button class="btn" data-act="pitch" data-unit="${u.id}">임대인 제안서 1장 만들기</button>` : ''}
  ${checkHtml(u.id)}</div>`, '#find');
  bindCheck(u.id);
}
function checkHtml(id) {
  const ck = (LS.get('check', {})[id]) || {}; const memo = (LS.get('memo', {})[id]) || '';
  return `<h3>현장 확인표</h3><div id="ckl">${CHECK.map((t, i) => `<label class="ck"><input type="checkbox" data-i="${i}" ${ck[i] ? 'checked' : ''}> ${esc(t)}</label>`).join('')}</div>
  <label class="f">메모</label><textarea class="t" id="memo" rows="3" placeholder="현장에서 본 것, 중개사 답변 등">${esc(memo)}</textarea>`;
}
function bindCheck(id) {
  const box = document.getElementById('ckl'); if (!box) return;
  box.addEventListener('change', e => { const all = LS.get('check', {}); all[id] = all[id] || {}; all[id][e.target.dataset.i] = e.target.checked; LS.set('check', all); });
  document.getElementById('memo').addEventListener('input', e => { const all = LS.get('memo', {}); all[id] = e.target.value; LS.set('memo', all); });
}
function vFav() {
  const fav = LS.get('fav', []); const mine = LS.get('mine', []); const memo = LS.get('memo', {});
  const items = fav.map(id => findU(id) || (D.cands.find(c => c.key === id) ? { cand: D.cands.find(c => c.key === id) } : null)).filter(Boolean);
  app.innerHTML = shell(`<div class="wrap"><h2>관심·메모</h2>
  ${items.length ? items.map(x => x.cand ? candCard(x.cand) : uRow(x)).join('') : '<p class="muted">아직 관심 저장한 물건이 없어요. 물건 상세에서 \'관심 저장\'을 누르세요.</p>'}
  <h3>직접 추가한 물건</h3>${mine.length ? mine.map(uRow).join('') : '<p class="muted">없음</p>'}<button class="btn w" data-go="#add" style="margin-top:8px">물건 직접 추가</button>
  ${Object.keys(memo).filter(k => memo[k]).length ? `<h3>메모 있는 물건</h3>${Object.keys(memo).filter(k => memo[k]).map(k => `<div class="card tap" data-go="${D.cands.find(c => c.key === k) ? '#c/' + k : '#u/' + k}"><b>${esc(k)}</b><p class="muted" style="margin:4px 0 0">${esc(memo[k]).slice(0, 80)}</p></div>`).join('')}` : ''}</div>`, '#fav');
}
function vAdd() {
  app.innerHTML = shell(`<div class="wrap"><h2>물건 직접 추가</h2><p class="muted">네이버나 중개사에게 받은 물건을 넣으면 같은 방식으로 분석합니다. 이 기기에만 저장됩니다.</p>
  <label class="f">네이버 매물 링크 또는 번호 (선택)</label><input class="t" id="an" placeholder="네이버 매물 링크를 붙여 넣으세요">
  <label class="f">동네</label><select class="t" id="ad">${DONGS.map(d => `<option>${d}</option>`).join('')}<option>기타</option></select>
  <div class="grid2"><div><label class="f">층 (지하는 -1)</label><input class="t" id="af" type="number" value="1"></div><div><label class="f">전용면적 (평)</label><input class="t" id="ap" type="number" value="25"></div></div>
  <div class="grid2"><div><label class="f">보증금 (만원)</label><input class="t" id="adp" type="number" value="3000"></div><div><label class="f">월세 (만원)</label><input class="t" id="ar" type="number" value="200"></div></div>
  <label class="f">특징 (선택)</label><input class="t" id="ax" placeholder="예: 루프탑, 엘리베이터, 무권리, 층고 3m">
  <div style="height:12px"></div><button class="btn" data-act="addSave">분석하기</button></div>`, '#fav');
}
function vSet() {
  const a = A(); const fields = [['cap', '환원율 (%)', '건물가치 = 연 임대료 ÷ 환원율'], ['popDay', '팝업 대관 평당 하루 (만원)', '29평 × 2.05 ≈ 60만/일 (연남·합정·성수·이태원 기준, 그 외 ×0.8)'], ['popDays', '팝업 대관 월 일수', ''], ['boothM', '라이브 부스 월 임대료 (만원)', ''], ['boothOcc', '월 부스 점유율 (%)', ''], ['boothCost', '부스 1실 공사비 (만원)', ''], ['roomM', '연습실 월 임대료 (만원)', '8~10㎡ 서울 평균 30~40만원 참고'], ['roomOcc', '연습실 점유율 (%)', ''], ['studioH', '촬영 스튜디오 시간당 (만원)', ''], ['studioHrs', '스튜디오 실당 월 시간', ''], ['officeM', '작업실 월 임대료 (만원)', ''], ['fitShow', '쇼룸 인테리어 평당 (만원)', ''], ['fitSound', '방음 공사 평당 (만원)', '견적 전 가정']];
  app.innerHTML = shell(`<div class="wrap"><h2>가정 값</h2><p class="muted">여기 숫자를 바꾸면 모든 물건의 사업 손익이 다시 계산됩니다. 견적·실제 운영 숫자가 나오면 여기로 고치세요.</p>
  ${fields.map(([k, t, h]) => `<label class="f">${t}</label><input class="t as" type="number" step="0.05" data-k="${k}" value="${a[k]}">${h ? `<div class="tiny">${esc(h)}</div>` : ''}`).join('')}
  <div class="grid2" style="margin-top:14px"><button class="btn" data-act="asSave">저장</button><button class="btn w" data-act="asReset">처음 값으로</button></div>
  <h3>출처 · 기준</h3><p class="tiny">${D.sources.map(esc).join('<br>')}</p></div>`, '#set');
}
function pitchSheet(o) {
  const t = `[제안] ${o.title}\n\n1) 지금 상태\n- ${o.now}\n\n2) 이렇게 쓰겠습니다\n- ${o.plan}\n- 인테리어: ${o.interior}\n\n3) 건물이 얻는 것\n- 월 ${o.rent}만원 임대 소득 → 건물가치 약 ${W(valueOf(o.rent))} (연 임대료 ÷ 환원율 ${A().cap}%, 가정)\n- 사람이 드나드는 공간이 생겨 다른 층 임대가 쉬워집니다\n\n4) 부탁드리는 것\n- ${o.asks.join('\n- ')}\n\n5) 믿으셔도 되는 근거\n- 운영 중인 사업: 틱톡 라이브 에이전시, 갤러리 큐레이션, 음악 제작(VARIOUS ARTISTS)\n- 원상복구와 소음·안전 기준을 계약서에 명시하겠습니다`;
  const dim = document.createElement('div'); dim.style.cssText = 'position:fixed;inset:0;background:rgba(0,0,0,.35);z-index:55'; const s = document.createElement('div'); s.style.cssText = 'position:fixed;left:50%;transform:translateX(-50%);bottom:0;width:100%;max-width:460px;max-height:90vh;overflow:auto;background:#fff;border-radius:18px 18px 0 0;z-index:60;padding:14px 16px 22px';
  s.innerHTML = `<div class="row"><b style="font-size:17px">임대인 제안서 1장</b><button class="btn w sm" id="pclose">닫기</button></div><p class="tiny">중개사를 통해 전달하거나 대화용으로 쓰세요. 숫자는 가정입니다.</p><div class="copy" id="ptext">${esc(t)}</div><button class="btn" id="pcopy" style="margin-top:10px">복사하기</button>`;
  const close = () => { dim.remove(); s.remove(); }; dim.onclick = close; document.body.appendChild(dim); document.body.appendChild(s);
  s.querySelector('#pclose').onclick = close; s.querySelector('#pcopy').onclick = async () => { try { await navigator.clipboard.writeText(t); toast('복사했어요'); } catch (e) { toast('길게 눌러 직접 복사해 주세요'); } };
}
// ---------- router ----------
function go(h) { state.route = h; state.listN = 30; try { history.pushState(null, '', h); } catch (e) {} route(); window.scrollTo(0, 0); }
window.addEventListener('popstate', () => { state.route = location.hash || '#home'; route(); });
function route() { const h = state.route; if (h === '#find') vFind(); else if (h.startsWith('#u/')) vUnit(h.slice(3)); else if (h === '#cands') vCands(); else if (h.startsWith('#c/')) vCand(h.slice(3)); else if (h === '#fav') vFav(); else if (h === '#add') vAdd(); else if (h === '#set') vSet(); else vHome(); }
document.addEventListener('click', e => {
  const g = e.target.closest('[data-go]'); if (g) { e.preventDefault(); go(g.dataset.go); return; }
  const a = e.target.closest('[data-act]'); if (!a) return; const act = a.dataset.act;
  if (act === 'lock') { LS.set('pw', null); lockScreen(); }
  else if (act === 'more') { state.listN += 30; vFind(); }
  else if (act === 'fav') { const f = LS.get('fav', []); const i = f.indexOf(a.dataset.id); if (i >= 0) f.splice(i, 1); else f.push(a.dataset.id); LS.set('fav', f); toast(i >= 0 ? '관심 해제' : '관심에 저장했어요'); route(); }
  else if (act === 'asSave') { const v = {}; document.querySelectorAll('.as').forEach(i => v[i.dataset.k] = +i.value); LS.set('assume', v); toast('저장했어요 · 다시 계산합니다'); }
  else if (act === 'asReset') { LS.set('assume', {}); vSet(); toast('처음 값으로 돌렸어요'); }
  else if (act === 'addSave') { const num = (document.getElementById('an').value.match(/\d{8,}/) || [])[0]; const py = +document.getElementById('ap').value || 0; const u = { id: num || 'my' + Date.now(), dong: document.getElementById('ad').value, f: +document.getElementById('af').value || 1, tot: null, a: Math.round(py * 3.3058), dep: +document.getElementById('adp').value || 0, rent: +document.getElementById('ar').value || 0, cls: 'u', tags: [], feat: document.getElementById('ax').value, conf: '' }; const med = ((D.med[u.dong] || {})[band(u.f)] || {}).m; u.gap = med ? Math.round((1 - u.rent / pyN(u.a) / med) * 100) : 0; const m = LS.get('mine', []); m.unshift(u); LS.set('mine', m); go('#u/' + u.id); }
  else if (act === 'pitch') {
    if (a.dataset.cand) { const c = D.cands.find(x => x.key === a.dataset.cand); pitchSheet({ title: c.where + ' (' + c.fl + ')', now: `광고 조건 보증금 ${W(c.dep)} / 월세 ${c.rent}만, 이 동 같은 층 시세보다 ${c.gap != null ? c.gap + '% 낮게' : '통째로'} 나와 있음`, plan: c.name + ' — ' + c.mine, interior: c.interior.concept, rent: c.rent, asks: c.ask }); }
    else { const u = findU(a.dataset.unit); const m = models(u)[0]; pitchSheet({ title: `${u.dong} ${flS(u.f)} ${pyN(u.a)}평`, now: `광고 조건 보증금 ${W(u.dep)} / 월세 ${u.rent}만, 이 동 같은 층 시세보다 ${u.gap}% 낮게 나와 있음`, plan: m.name + ' (' + m.note + ')', interior: CONCEPT[m.lay][0], rent: u.rent, asks: ['렌트프리 2~3개월 (공사 기간)', '전대·단기 대관 허용을 계약서에 명시', '시설 원상복구 범위 사전 합의'] }); }
  }
});
state.route = location.hash && location.hash.length > 1 ? location.hash : '#home';
route();
}
})();
</script>
