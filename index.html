/* ---------- map ---------- */
const TILE = (z, x, y) => `https://${'abc'[(x + y) % 3]}.tile.openstreetmap.fr/hot/${z}/${x}/${y}.png`;
function P(lat, lng, z) { const s = 256 * Math.pow(2, z); const x = (lng + 180) / 360 * s; const r = lat * Math.PI / 180; const y = (1 - Math.log(Math.tan(r) + 1 / Math.cos(r)) / Math.PI) / 2 * s; return [x, y]; }
function UP(x, y, z) { const s = 256 * Math.pow(2, z); const lng = x / s * 360 - 180; const n = Math.PI - 2 * Math.PI * y / s; return [180 / Math.PI * Math.atan(0.5 * (Math.exp(n) - Math.exp(-n))), lng]; }
function makeMap(el, center, zoom, markers, onPick) {
  const st = { c: center.slice(), z: zoom, drag: null, moved: false, raf: 0 };
  el.innerHTML = `<div class="layer"></div><div class="zoom"><button data-z="1">+</button><button data-z="-1">−</button></div><div class="attr">© OpenStreetMap 기여자 · HOT · OSM France</div>`;
  const layer = el.querySelector('.layer');
  function render() {
    const W = el.clientWidth, H = el.clientHeight; const [cx, cy] = P(st.c[0], st.c[1], st.z); const L = cx - W / 2, T = cy - H / 2; const n = Math.pow(2, st.z); let h = '';
    for (let tx = Math.floor(L / 256); tx <= Math.floor((L + W) / 256); tx++) for (let ty = Math.floor(T / 256); ty <= Math.floor((T + H) / 256); ty++) { if (ty < 0 || ty >= n) continue; h += `<img class="tile" src="${TILE(st.z, ((tx % n) + n) % n, ty)}" style="left:${Math.round(tx * 256 - L)}px;top:${Math.round(ty * 256 - T)}px" alt="">`; }
    markers.forEach((m, i) => { const [x, y] = P(m.lat, m.lng, st.z); const l = x - L, t = y - T; if (l < -30 || t < -30 || l > W + 30 || t > H + 30) return; h += `<b class="mk ${m.cls}${state.mapSel === m.key ? ' sel' : ''}" data-i="${i}" style="left:${l.toFixed(1)}px;top:${t.toFixed(1)}px">${m.label || ''}</b>`; });
    layer.innerHTML = h;
  }
  el.addEventListener('pointerdown', e => { if (e.target.closest('.zoom')) return; st.drag = { x: e.clientX, y: e.clientY, c: st.c.slice() }; st.moved = false; el.setPointerCapture(e.pointerId); });
  el.addEventListener('pointermove', e => { if (!st.drag) return; const dx = e.clientX - st.drag.x, dy = e.clientY - st.drag.y; if (Math.abs(dx) + Math.abs(dy) > 4) st.moved = true; const [cx, cy] = P(st.drag.c[0], st.drag.c[1], st.z); st.c = UP(cx - dx, cy - dy, st.z); if (!st.raf) st.raf = requestAnimationFrame(() => { st.raf = 0; render(); }); });
  el.addEventListener('pointerup', e => { const wasMoved = st.moved; const d = st.drag; st.drag = null; if (!wasMoved && d) { const hit = document.elementsFromPoint(e.clientX, e.clientY).find(x => x.classList && x.classList.contains('mk')); if (hit) onPick(markers[+hit.dataset.i]); } });
  el.querySelector('.zoom').addEventListener('click', e => { const b = e.target.closest('button'); if (!b) return; st.z = Math.max(12, Math.min(18, st.z + (+b.dataset.z))); render(); });
  render();
  return { render, st };
}

  const P = [

    ['임대인이 직접 올리는 공실', '건물 주인이 자기 건물을 직접 내놓는 것은 중개가 아닙니다. 등기부상 소유자와 대조한 뒤 노출하고, 계약은 원하시는 제휴 중개사가 맡습니다.', '직거래 등록 (네모 등도 운영)'],
    ['네이버로 바로 가는 링크', '네이버 매물을 복사해 오지 않고, 동네별로 네이버 부동산 화면을 바로 열어 드립니다. 다른 회사 매물 DB를 긁어 와 게시하면 데이터베이스제작자 권리 침해가 됩니다(네이버 대 다윈중개, 특허법원 2025.12.24 판결, 8,000만원 배상).', '저작권법 제93조'],
    ['우리 중개법인 (2단계)', '자본금 5천만원 이상, 공인중개사 대표, 임원 3분의 1 이상 공인중개사 등을 갖춰 중개법인을 세우면 직접 중개하고 임대관리·개발 상담·분양대행까지 할 수 있습니다. 공사 관리·플랫폼은 별도 회사로 둡니다.', '공인중개사법 시행령 제13조, 법 제14조'],
    ['우리 돈은 우리 몫만', '예약금·공사대금은 제휴 에스크로에 맡기고, 중개보수는 나눠 받지 않으며, 투자는 법률 구조 확정 전까지 모집하지 않습니다.', '전자금융·자본시장 관련 법 검토 후 시행']];
  app.innerHTML = shell(`<div class="wrap"><h2>실제 공실, 법 안에서 이렇게 보여 드립니다</h2><p class="muted">공개판에 개별 매물이 없는 이유와, 서비스에서 실제 공실을 보여 주는 합법적인 길입니다.</p>
  ${P.map((p, i) => `<div class="card"><div class="row"><b style="font-size:15px">${i + 1}. ${esc(p[0])}</b></div><p class="muted" style="margin:6px 0 4px">${esc(p[1])}</p><span class="tag l">${esc(p[2])}</span></div>`).join('')}
  <p class="tiny">공개 자료를 정리한 것이며 법률 자문이 아닙니다. 출시 전 부동산·금융 전문 변호사 검토를 거칩니다.</p></div>`, '#map');
}

/* ---------- broker posting (demo) ---------- */
const POST_FIELDS = [['office', '중개사무소 명칭'], ['ceo', '개업공인중개사 성명'], ['reg', '등록번호'], ['oaddr', '사무소 소재지'], ['tel', '연락처'], ['addr', '매물 소재지 (동까지)'], ['floor', '층 / 총 층수'], ['area', '전용면적 (㎡)'], ['price', '보증금 / 월세 (만원)'], ['kind', '건축물 용도'], ['aprv', '사용승인일'], ['movein', '입주 가능일']];
function vPost() {
  const p = LS.get('postDraft', { office: '', ceo: '', reg: '', oaddr: '', tel: '', addr: '연남동', floor: '1 / 4', area: '', price: '', kind: '제2종 근린생활시설', aprv: '', movein: '즉시' });
  app.innerHTML = shell(`<div class="wrap"><h2>공실 매물 올리기 <span class="tag l">시연</span></h2><p class="muted">광고 주체는 중개사님입니다. 법에서 정한 명시사항을 칸마다 받아 빠뜨리지 않게 합니다.</p>
  ${POST_FIELDS.map(([k, t]) => `<label class="f">${t}</label><input class="t pf" data-k="${k}" value="${esc(p[k])}">`).join('')}
  <div class="card mint" style="margin-top:12px" id="pchk"></div>
  <button class="btn" data-act="savePost">올리기 (시연)</button>
  <p class="tiny" style="margin-top:8px">시연판에서는 이 기기에서만 보이고 서버로 보내지 않습니다. 서비스에서는 등록번호를 확인한 중개사만 올릴 수 있습니다.</p></div>`, '#home');
  const upd = () => { const v = {}; document.querySelectorAll('.pf').forEach(i => v[i.dataset.k] = i.value.trim()); LS.set('postDraft', v); const miss = POST_FIELDS.filter(([k]) => !v[k]); document.getElementById('pchk').innerHTML = `<b>명시사항 확인</b>${miss.length ? `<div class="chk no">빠진 칸 ${miss.length}개: ${miss.map(m => m[1]).join(', ')}</div>` : '<div class="chk ok">모든 명시사항이 채워졌습니다</div>'}<div class="tiny">중개보조원 정보는 넣을 수 없습니다(2026.8.28 개정).</div>`; };
  document.querySelectorAll('.pf').forEach(i => i.addEventListener('input', upd)); upd();
}
function postCard(p) {
  return `<div class="disc"><div class="t">제휴 중개사 매물 · 시연</div><div class="row"><b style="font-size:15px">${esc(p.addr)} · ${esc(p.floor)}층 · ${esc(p.area)}㎡</b><b>${esc(p.price)}</b></div>
  <table><tr><td>용도</td><td>${esc(p.kind)}</td></tr><tr><td>사용승인일</td><td>${esc(p.aprv)}</td></tr><tr><td>입주 가능</td><td>${esc(p.movein)}</td></tr>
  <tr><td>중개사무소</td><td>${esc(p.office)} (등록번호 ${esc(p.reg)})</td></tr><tr><td>대표</td><td>${esc(p.ceo)} · ${esc(p.tel)}</td></tr><tr><td>사무소 소재지</td><td>${esc(p.oaddr)}</td></tr></table></div>`;
}
function myPosts() { return LS.get('posts', []); }

/* ---------- router & actions ---------- */
function go(h) { state.route = h; try { if (location.hash !== h) history.pushState(null, '', h); } catch (e) {} state.listN = 20; route(); window.scrollTo(0, 0); }
window.addEventListener('popstate', () => { state.route = location.hash || '#home'; route(); });
function route() {
  closeSheet();
  const h = state.route || location.hash || '';
  if (!state.role && h !== '#start') { vStart(); return; }
  if (h === '#start') { vStart(); }
  else if (h === '#map') vMap();
  else if (h === '#rooms') vRooms();
  else if (h.startsWith('#room/')) vRoom(h.slice(6));
  else if (h === '#join') vJoin();
  else if (h === '#matches') vMatches();
  else if (h === '#owner') vOwner();
  else if (h === '#partner') vPartner();
  else if (h === '#data') vData();
  else if (h === '#me') vMe();
  else if (h.startsWith('#why/')) vWhy(h.slice(5));
  else if (h === '#law') vLaw();
  else if (h === '#post') vPost();
  else if (h === '#invest') { LS.set('invest', true); toast('관심 등록했어요'); state.route = '#home'; vHome(); }
  else vHome();
}
document.addEventListener('click', e => {
  const gEl = e.target.closest('[data-go]'); if (gEl) { e.preventDefault(); go(gEl.dataset.go); return; }
  const rl = e.target.closest('[data-role]'); if (rl) { state.role = rl.dataset.role; LS.set('role', state.role); go('#why/' + state.role); return; }
  const un = e.target.closest('[data-unit]'); if (un) { const u = U.find(x => x[0] === un.dataset.unit); if (u) openUnit(u); return; }
  const a = e.target.closest('[data-act]'); if (!a) return;
  const act = a.dataset.act;
  if (act === 'saveJoin') saveJoin();
  else if (act === 'more') { state.listN += 30; route(); }
  else if (act === 'fav') { const f = LS.get('fav', []); const id = a.dataset.id; const i = f.indexOf(id); if (i >= 0) f.splice(i, 1); else f.push(id); LS.set('fav', f); toast(i >= 0 ? '관심 해제' : '관심 자리에 저장했어요'); closeSheet(); }
  else if (act === 'pledge') pledgeFlow(a.dataset.room, +a.dataset.i);
  else if (act === 'pledgeOk') { const p = pledges(); const rid = a.dataset.room; p[rid] = p[rid] || []; const i = +a.dataset.i; if (!p[rid].includes(i)) p[rid].push(i); LS.set('pledges', p); closeSheet(); const r = D.rooms.find(x => x.id === rid); const pr = roomProgress(r); toast(pr.pct >= 70 ? '목표 달성! 설계·공사 단계가 열려요' : '확약했어요 · ' + pr.n + '/' + pr.total + '칸'); vRoom(rid); }
  else if (act === 'saveOwner') saveOwner();
  else if (act === 'savePost') { const v = LS.get('postDraft', {}); const miss = POST_FIELDS.filter(([k]) => !v[k]); if (miss.length) { toast('빠진 명시사항 ' + miss.length + '개를 채워 주세요'); return; } const ps = myPosts(); ps.unshift({ ...v, at: Date.now() }); LS.set('posts', ps); toast('올렸어요 (시연)'); go('#map'); }
  else if (act === 'openRoom') toast('프로젝트 방 열기 신청을 받았어요 (시연)');
  else if (act === 'savePartner') { LS.set('partner', { kind: onChips('pk')[0] || '건축사사무소', name: document.getElementById('pn').value, no: document.getElementById('pno').value }); toast('파트너 정보를 저장했어요'); }
  else if (act === 'propose') { const pp = LS.get('props', {}); const rid = a.dataset.room; pp[rid] = pp[rid] || []; if (pp[rid].length < 3) pp[rid].push(Date.now()); LS.set('props', pp); toast('기획안을 냈어요 (시연)'); vRoom(rid); }
  else if (act === 'bid') toast('견적을 냈어요 (시연)');
  else if (act === 'invest') { LS.set('invest', !LS.get('invest', false)); vHome(); }
  else if (act === 'reset') { try { Object.keys(localStorage).filter(k => k.startsWith('gm_')).forEach(k => localStorage.removeItem(k)); } catch (e) {} state.role = null; go('#start'); }
});
window.addEventListener('hashchange', () => { if (location.hash && location.hash !== state.route) { state.route = location.hash; state.listN = 20; route(); window.scrollTo(0, 0); } });
route();
})();
</script>
</body>
</html>
